; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelavr
board = nanoatmega328 ; mude para nanoatmega328new se der erro de upload
framework = arduino
monitor_speed = 115200
lib_deps =
    autowp/autowp-mcp2515@^1.0.3

; Ambiente para gravar o Arduino Nano 1 (Botões)
[env:ecu_botoes]
build_src_filter = +<ecu_botoes/*> -<ecu_leds/*>
; upload_port = /dev/ttyUSB0  ; (Opcional) Descomente para fixar a porta USB

; Ambiente para gravar o Arduino Nano 2 (LEDs)
[env:ecu_leds]
build_src_filter = +<ecu_leds/*> -<ecu_botoes/*>
; upload_port = /dev/ttyUSB1  ; (Opcional) Descomente para fixar a porta USB